name: Rust CI
on:
  pull_request:
  push:
  workflow_call:

permissions:
  contents: read

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up Rust stable
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - run: cargo +stable fmt --all -- --check
      - run: cargo +stable clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo +stable test --locked --workspace
      - run: cargo +stable build --locked --workspace
      - name: Verify Unix installation and removal
        if: runner.os != 'Windows'
        shell: bash
        run: |
          sandbox_home="$(mktemp -d)/한글 User"
          case "$RUNNER_OS" in
            macOS) installer=macos ;;
            Linux) installer=linux ;;
          esac
          HOME="$sandbox_home" "installers/$installer/install.sh" abcdefghijklmnopabcdefghijklmnop target/debug/super-boj-core
          HOME="$sandbox_home" "installers/$installer/uninstall.sh"
      - name: Verify Windows installation and removal
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:LOCALAPPDATA = Join-Path $env:RUNNER_TEMP 'SUPER_BOJ 한글 User'
          try {
              & ./installers/windows/install.ps1 -ExtensionId abcdefghijklmnopabcdefghijklmnop -Binary ./target/debug/super-boj-core.exe
          } finally {
              & ./installers/windows/uninstall.ps1
          }
